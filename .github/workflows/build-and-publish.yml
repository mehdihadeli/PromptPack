name: Build, test, and publish

on:
  pull_request:
  push:
    branches:
      - main
    tags:
      - "v*"

permissions:
  contents: read

jobs:
  build-test:
    name: Build and test
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x

      - name: Restore
        run: dotnet restore PromptPack.slnx

      - name: Build
        run: dotnet build PromptPack.slnx --configuration Release --no-restore

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22.x

      - name: Test Core
        run: dotnet test --project tests/PromptPack.Core.Tests/PromptPack.Core.Tests.csproj --configuration Release --no-restore

      - name: Test CLI
        run: dotnet test --project tests/PromptPack.Cli.Tests/PromptPack.Cli.Tests.csproj --configuration Release --no-restore

  publish:
    name: Publish packages and release assets
    if: startsWith(github.ref, 'refs/tags/v')
    needs: build-test
    runs-on: ubuntu-latest
    environment: nuget
    permissions:
      contents: write

    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x

      - name: Restore
        run: dotnet restore src/PromptPack.Cli/PromptPack.Cli.csproj

      - name: Install nbgv CLI
        run: dotnet tool install --tool-path "$RUNNER_TEMP/nbgv" nbgv --version 3.10.94

      - name: Calculate release version
        id: version
        shell: bash
        run: echo "version=$($RUNNER_TEMP/nbgv/nbgv get-version -v SemVer2)" >> "$GITHUB_OUTPUT"

      - name: Pack
        run: dotnet pack src/PromptPack.Cli/PromptPack.Cli.csproj --configuration Release --no-restore --output artifacts -p:PublicRelease=true

      - name: Publish to NuGet.org
        run: dotnet nuget push "artifacts/*.nupkg" --api-key "${{ secrets.NUGET_API_KEY }}" --source https://api.nuget.org/v3/index.json --skip-duplicate

      - name: Publish self-contained executables
        shell: bash
        run: |
          set -euo pipefail
          for runtime in linux-x64 osx-x64 osx-arm64; do
            publish_dir="release/$runtime"
            mkdir -p "$publish_dir"
            dotnet publish src/PromptPack.Cli/PromptPack.Cli.csproj \
              --configuration Release \
              --runtime "$runtime" \
              --self-contained true \
              --output "$publish_dir" \
              -p:PublishSingleFile=true \
              -p:IncludeNativeLibrariesForSelfExtract=true \
              -p:PublishTrimmed=false
            tar -czf "artifacts/promptpack-$runtime.tar.gz" -C "$publish_dir" promptpack
          done

      - name: Publish matching Release Drafter draft
        uses: release-drafter/release-drafter@v7
        with:
          config-name: release-drafter.yml
          version: ${{ steps.version.outputs.version }}
          name: v${{ steps.version.outputs.version }}
          tag: ${{ github.ref_name }}
          publish: true
          prerelease: ${{ contains(github.ref_name, '-') }}
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Upload release assets
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: gh release upload "${{ github.ref_name }}" artifacts/promptpack-*.tar.gz --clobber
